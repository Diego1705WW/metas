<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis metas de ahorro</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">

<!-- VISTA LISTA -->
<section id="vList" class="app" style="gap:14px">
  <h1>🏁 MIS METAS DE AHORRO</h1>
  <div class="bar" id="barNormal">
    <button class="blue" id="btnAdd">＋ Añadir meta</button>
    <button class="ghost" id="btnSel">☑ Seleccionar varias</button>
  </div>
  <div class="bar hide" id="barSel">
    <button class="red" id="btnDelSel">🗑 Eliminar (0)</button>
    <button class="ghost" id="btnCancelSel">Cancelar</button>
  </div>
  <div id="list" class="app" style="gap:10px"></div>
</section>

<!-- VISTA DETALLE -->
<section id="vDetail" class="app hide">
  <div class="bar"><button class="ghost" id="btnBack" style="flex:none">← Volver</button></div>
  <div style="display:flex;align-items:center;justify-content:center;gap:6px"><h1 id="dName"></h1><button class="edit" id="dEdit" title="Editar meta">✏️</button></div>
  <div class="card gauge">
    <svg viewBox="0 0 240 150" aria-label="Medidor de progreso">
      <path class="track" d="M20 120 A100 100 0 0 1 220 120" pathLength="100"/>
      <path id="fill" class="fill" d="M20 120 A100 100 0 0 1 220 120" pathLength="100"/>
      <g id="ticks"></g>
      <g id="needle" class="needle" style="transform:rotate(-90deg)">
        <line x1="120" y1="120" x2="120" y2="38" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="120" cy="120" r="8" fill="#fff"/><circle cx="120" cy="120" r="3" fill="#151922"/>
      </g>
      <text x="14" y="142" fill="#8b94a7" font-size="10">0%</text>
      <text x="206" y="142" fill="#8b94a7" font-size="10">100%</text>
    </svg>
    <div class="pct" id="pct">0%</div>
    <div class="amounts">Ahorrado <b id="saved"></b> de <b id="goal"></b></div>
    <div class="status" id="status"></div>
  </div>
  <div class="card">
    <label class="l" for="amt" style="margin-top:0">Monto</label>
    <input id="amt" type="number" min="0" inputmode="decimal" placeholder="Ej: 200">
    <div class="bar" style="margin-top:12px">
      <button class="green" id="dep">＋ Depositar</button>
      <button class="red" id="ret">－ Retirar</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="card"><label class="l" style="margin-top:0">Movimientos</label><ul id="hist"></ul></div>
</section>

</main>

<!-- MODAL AÑADIR -->
<div class="ov hide" id="mAdd"><div class="modal">
  <h2 id="mAddTitle">Nueva meta</h2>
  <label class="l" for="nName">Nombre</label>
  <input id="nName" type="text" maxlength="40" placeholder="Ej: Viaje, Moto, Celular">
  <label class="l" for="nGoal">Monto a ahorrar (Bs)</label>
  <input id="nGoal" type="number" min="1" inputmode="decimal" placeholder="Ej: 5000">
  <div class="msg" id="mAddMsg"></div>
  <div class="bar" style="margin-top:8px"><button class="blue" id="mAddOk">Guardar</button><button class="ghost" id="mAddNo">Cancelar</button></div>
</div></div>

<!-- MODAL CONFIRMAR -->
<div class="ov hide" id="mConf"><div class="modal">
  <h2 id="cTitle">¿Seguro que quieres eliminar?</h2>
  <p>Esta acción no se puede deshacer.</p>
  <ul id="cList"></ul>
  <div class="bar"><button class="red" id="cOk">Sí, eliminar</button><button class="ghost" id="cNo">Cancelar</button></div>
</div></div>

<script>
const KEY='metasAhorro_v2',OLD='metaAhorro_v1';
let goals=[],cur=null,selMode=false,sel=new Set(),pending=[];
const $=id=>document.getElementById(id);
const fmt=n=>'Bs '+Number(n).toLocaleString('es-BO',{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(goals))}catch(e){}};
const show=(el,v)=>el.classList.toggle('hide',!v);
const done=g=>g.target>0&&g.saved>=g.target;
const pctOf=g=>g.target>0?Math.min(100,g.saved/g.target*100):0;

try{
  const r=localStorage.getItem(KEY);
  if(r){const p=JSON.parse(r);if(Array.isArray(p))goals=p}
  else{const o=JSON.parse(localStorage.getItem(OLD)||'null');
    if(o&&o.goal>0){goals=[{id:uid(),name:'Mi meta',target:o.goal,saved:o.saved||0,hist:o.hist||[]}];save()}}
}catch(e){}

(function(){let h='';for(let i=0;i<=10;i++){const a=(-180+i*18)*Math.PI/180;
h+=`<line class="tick" x1="${(120+88*Math.cos(a)).toFixed(1)}" y1="${(120+88*Math.sin(a)).toFixed(1)}" x2="${(120+78*Math.cos(a)).toFixed(1)}" y2="${(120+78*Math.sin(a)).toFixed(1)}"/>`}
$('ticks').innerHTML=h})();

/* ---------- LISTA ---------- */
function renderList(){
  const box=$('list');box.innerHTML='';
  if(!goals.length){box.innerHTML='<div class="card empty">Aún no tienes metas.<br>Pulsa «Añadir meta» para crear la primera.</div>'}
  goals.forEach(g=>{
    const c=document.createElement('div');c.className='card goal'+(done(g)?' done':'');
    if(selMode){const k=document.createElement('input');k.type='checkbox';k.className='chk';k.checked=sel.has(g.id);
      k.onclick=e=>{e.stopPropagation();k.checked?sel.add(g.id):sel.delete(g.id);updSel()};c.appendChild(k)}
    const info=document.createElement('div');info.className='info';
    const n=document.createElement('div');n.className='name';n.textContent=g.name;
    const s=document.createElement('div');s.className='sub';s.textContent=fmt(g.saved)+' de '+fmt(g.target)+' · '+Math.round(pctOf(g))+'%';
    const m=document.createElement('div');m.className='mini';m.innerHTML='<i style="width:'+pctOf(g)+'%"></i>';
    info.append(n,s,m);
    if(done(g)){const b=document.createElement('span');b.className='badge';b.textContent='✔ Meta completada';info.appendChild(b)}
    c.appendChild(info);
    if(!selMode){const ed=document.createElement('button');ed.className='edit';ed.textContent='✏️';ed.title='Editar meta';
      ed.onclick=e=>{e.stopPropagation();openEdit(g.id)};c.appendChild(ed);
      const d=document.createElement('button');d.className='del';d.textContent='🗑';d.title='Eliminar meta';
      d.onclick=e=>{e.stopPropagation();askDelete([g.id])};c.appendChild(d)}
    c.onclick=()=>{if(selMode){if(sel.has(g.id))sel.delete(g.id);else sel.add(g.id);renderList();updSel()}else openDetail(g.id)};
    box.appendChild(c);
  });
  show($('barNormal'),!selMode);show($('barSel'),selMode);updSel();
}
function updSel(){$('btnDelSel').textContent='🗑 Eliminar ('+sel.size+')';$('btnDelSel').style.opacity=sel.size?1:.5}
$('btnSel').onclick=()=>{if(!goals.length)return;selMode=true;sel.clear();renderList()};
$('btnCancelSel').onclick=()=>{selMode=false;sel.clear();renderList()};
$('btnDelSel').onclick=()=>{if(sel.size)askDelete([...sel])};

/* ---------- AÑADIR ---------- */
let editId=null;
$('btnAdd').onclick=()=>{editId=null;$('mAddTitle').textContent='Nueva meta';$('nName').value='';$('nGoal').value='';$('mAddMsg').textContent='';show($('mAdd'),true);$('nName').focus()};
function openEdit(id){
  const g=goals.find(x=>x.id===id);if(!g)return;
  editId=id;$('mAddTitle').textContent='Editar meta';$('nName').value=g.name;$('nGoal').value=g.target;$('mAddMsg').textContent='';
  show($('mAdd'),true);$('nName').focus();$('nName').select();
}
$('dEdit').onclick=()=>openEdit(cur);
$('mAddNo').onclick=()=>show($('mAdd'),false);
$('mAddOk').onclick=()=>{
  const name=$('nName').value.trim(),t=parseFloat($('nGoal').value);
  if(!name){$('mAddMsg').textContent='Escribe un nombre para la meta';return}
  if(!(t>0)){$('mAddMsg').textContent='Escribe un monto válido';return}
  if(editId){const g=goals.find(x=>x.id===editId);if(g){g.name=name;g.target=t}editId=null}
  else goals.push({id:uid(),name,target:t,saved:0,hist:[]});
  save();show($('mAdd'),false);renderList();if(cur)renderDetail();
};

/* ---------- ELIMINAR (con confirmación) ---------- */
function askDelete(ids){
  pending=ids;
  $('cTitle').textContent=ids.length>1?'¿Seguro que quieres eliminar estas '+ids.length+' metas?':'¿Seguro que quieres eliminar esta meta?';
  $('cList').innerHTML='';
  goals.filter(g=>ids.includes(g.id)).forEach(g=>{const li=document.createElement('li');li.textContent='• '+g.name;$('cList').appendChild(li)});
  show($('mConf'),true);
}
$('cNo').onclick=()=>{pending=[];show($('mConf'),false)};
$('cOk').onclick=()=>{
  goals=goals.filter(g=>!pending.includes(g.id));pending=[];sel.clear();selMode=false;
  save();show($('mConf'),false);renderList();
};

/* ---------- DETALLE ---------- */
function openDetail(id){cur=id;$('msg').textContent='';$('amt').value='';show($('vList'),false);show($('vDetail'),true);renderDetail()}
$('btnBack').onclick=()=>{cur=null;show($('vDetail'),false);show($('vList'),true);renderList()};
function renderDetail(){
  const g=goals.find(x=>x.id===cur);if(!g)return;
  const p=pctOf(g),ok=done(g);
  $('dName').textContent=g.name;
  $('fill').style.strokeDasharray=p+' 100';
  $('fill').style.stroke=ok?'#22c55e':(p>=60?'#84cc16':(p>=30?'#f59e0b':'#ef4444'));
  $('needle').style.transform='rotate('+(-90+p*1.8)+'deg)';
  $('pct').textContent=Math.round(p)+'%';
  $('saved').textContent=fmt(g.saved);$('goal').textContent=fmt(g.target);
  $('status').className='status'+(ok?' ok':'');
  $('status').textContent=ok?'🎉 ¡META COMPLETADA!':'Te faltan '+fmt(g.target-g.saved)+' para tu meta';
  $('hist').innerHTML='';
  if(!g.hist.length){$('hist').innerHTML='<li><small>Aún no hay movimientos</small></li>'}
  else g.hist.slice().reverse().forEach(m=>{const li=document.createElement('li');
    li.innerHTML=`<span class="${m.t==='d'?'d':'r'}">${m.t==='d'?'+':'−'} ${fmt(m.a)}</span><small>${m.f}</small>`;$('hist').appendChild(li)});
}
function move(t){
  const g=goals.find(x=>x.id===cur);if(!g)return;
  const a=parseFloat($('amt').value);
  if(!(a>0)){$('msg').textContent='Escribe un monto válido';return}
  if(t==='r'&&a>g.saved){$('msg').textContent='No puedes retirar más de lo ahorrado';return}
  $('msg').textContent='';
  g.saved+=t==='d'?a:-a;
  g.hist.push({t,a,f:new Date().toLocaleString('es-BO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})});
  if(g.hist.length>50)g.hist.shift();
  $('amt').value='';save();renderDetail();
}
$('dep').onclick=()=>move('d');$('ret').onclick=()=>move('r');

renderList();
</script>
</body>
</html>
